<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lander Automation Sandbox</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #22335f, #080b13 58%); color: #f5f7fb; }
      main { width: min(760px, calc(100% - 32px)); padding: 42px; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; background: rgba(10,15,28,.78); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      .pill { display: inline-flex; padding: 8px 12px; border-radius: 999px; background: rgba(89, 255, 171, .14); color: #78ffbd; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; font-size: 12px; }
      h1 { font-size: clamp(34px, 6vw, 64px); line-height: .95; margin: 22px 0 16px; }
      p { color: #cfd7ea; font-size: 18px; line-height: 1.6; }
      code { color: #78ffbd; }
    </style>
  </head>
  <body>
    <main>
      <span class="pill">Sandbox online</span>
      <h1>Automação de Landers</h1>
      <p>Ambiente controlado para validar deploy real via GitHub Pages antes de tocar produção, RedTrack ou cPanel.</p>
      <p>Domínio esperado: <code>landers-sandbox.arakakileo.lat</code></p>
    </main>
  </body>
</html>
